name: "skilllint"
description: "Validate Claude Code plugins, skills, agents, and commands using skilllint"
author: "bitflight-devops"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  paths:
    description: >
      Space-separated list of paths to validate (files or directories).
      Defaults to the current working directory.
    required: false
    default: "."

  platform:
    description: >
      Platform adapter to use for validation.
      Supported values: claude-code, cursor, codex.
      Leave empty to use the default validation route.
    required: false
    default: ""

  fix:
    description: "Auto-fix issues where possible. Mutually exclusive with check-only and platform."
    required: false
    default: "false"

  check-only:
    description: "Validate only, do not auto-fix. Mutually exclusive with fix."
    required: false
    default: "false"

  verbose:
    description: "Show detailed validation output including info messages."
    required: false
    default: "false"

  no-color:
    description: "Disable color output. Recommended for CI logs."
    required: false
    default: "true"

  tokens-only:
    description: "Output only the integer token count (for programmatic use)."
    required: false
    default: "false"

  show-progress:
    description: "Show per-file PASSED/FAILED status for all scanned files."
    required: false
    default: "false"

  show-summary:
    description: "Show a validation summary panel at the end of the run."
    required: false
    default: "true"

  filter:
    description: "Glob pattern to restrict which files inside a directory are validated."
    required: false
    default: ""

  filter-type:
    description: >
      Restrict validation to a specific file type.
      Supported values: skills, agents, commands.
    required: false
    default: ""

  version:
    description: >
      Version of skilllint to install (e.g. "1.2.3", "latest").
      Use "latest" to always install the newest published release.
    required: false
    default: "latest"

  python-version:
    description: "Python version to use when running skilllint."
    required: false
    default: "3.12"

outputs:
  result:
    description: >
      Validation outcome: 'passed' when exit code is 0 (all checks pass),
      'failed' for any non-zero exit code (validation errors or usage/configuration errors).
      Use the 'exit-code' output to distinguish between exit code 1 (validation errors)
      and exit code 2 (usage/configuration errors).
    value: ${{ steps.run-skilllint.outputs.result }}

  exit-code:
    description: >
      Raw exit code returned by skilllint check.
      0 = all checks passed, 1 = validation errors found, 2 = usage/configuration error.
    value: ${{ steps.run-skilllint.outputs.exit-code }}

  inspected-count:
    description: "Number of files inspected by skilllint."
    value: ${{ steps.run-skilllint.outputs.inspected-count }}

  findings:
    description: "Distinct finding codes emitted by skilllint."
    value: ${{ steps.run-skilllint.outputs.findings }}

  tool-python:
    description: "Python runtime used by the installed skilllint tool."
    value: ${{ steps.run-skilllint.outputs.tool-python }}

  tool-version:
    description: "Version reported by the installed skilllint tool."
    value: ${{ steps.run-skilllint.outputs.tool-version }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: false

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      env:
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv python install "${INPUT_PYTHON_VERSION}"

    - name: Install skilllint
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        if [ "${INPUT_VERSION}" = "latest" ]; then
          uv tool install --python "${INPUT_PYTHON_VERSION}" skilllint
        else
          uv tool install --python "${INPUT_PYTHON_VERSION}" "skilllint==${INPUT_VERSION}"
        fi

    - name: Run skilllint check
      id: run-skilllint
      shell: bash
      env:
        INPUT_CHECK_ONLY: ${{ inputs.check-only }}
        INPUT_FIX: ${{ inputs.fix }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_NO_COLOR: ${{ inputs.no-color }}
        INPUT_TOKENS_ONLY: ${{ inputs.tokens-only }}
        INPUT_SHOW_PROGRESS: ${{ inputs.show-progress }}
        INPUT_SHOW_SUMMARY: ${{ inputs.show-summary }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_FILTER: ${{ inputs.filter }}
        INPUT_FILTER_TYPE: ${{ inputs.filter-type }}
        INPUT_PATHS: ${{ inputs.paths }}
      run: |
        set +e  # do not exit on non-zero. We capture the exit code ourselves

        ARGS=()

        # Boolean flags
        if [ "${INPUT_CHECK_ONLY}" = "true" ]; then
          ARGS+=("--check")
        fi
        if [ "${INPUT_FIX}" = "true" ]; then
          ARGS+=("--fix")
        fi
        if [ "${INPUT_VERBOSE}" = "true" ]; then
          ARGS+=("--verbose")
        fi
        if [ "${INPUT_NO_COLOR}" = "true" ]; then
          ARGS+=("--no-color")
        fi
        if [ "${INPUT_TOKENS_ONLY}" = "true" ]; then
          ARGS+=("--tokens-only")
        fi
        if [ "${INPUT_SHOW_PROGRESS}" = "true" ]; then
          ARGS+=("--show-progress")
        fi
        if [ "${INPUT_SHOW_SUMMARY}" = "true" ]; then
          ARGS+=("--show-summary")
        fi

        # Optional string flags
        if [ -n "${INPUT_PLATFORM}" ]; then
          ARGS+=("--platform" "${INPUT_PLATFORM}")
        fi
        if [ -n "${INPUT_FILTER}" ]; then
          ARGS+=("--filter" "${INPUT_FILTER}")
        fi
        if [ -n "${INPUT_FILTER_TYPE}" ]; then
          ARGS+=("--filter-type" "${INPUT_FILTER_TYPE}")
        fi

        # Paths (space-separated, split into individual arguments)
        read -ra PATH_ARGS <<< "${INPUT_PATHS}"

        OUTPUT_FILE="$(mktemp)"
        skilllint check "${ARGS[@]}" "${PATH_ARGS[@]}" >"${OUTPUT_FILE}" 2>&1
        EXIT_CODE=$?

        cat "${OUTPUT_FILE}"

        INSPECTED_COUNT="$(sed -n 's/^Total files: \([0-9][0-9]*\)$/\1/p' "${OUTPUT_FILE}" | tail -n 1)"
        if [ "${INPUT_TOKENS_ONLY}" = "true" ] && [ "${EXIT_CODE}" -ne 2 ]; then
          INSPECTED_COUNT="$(grep -cE '^[0-9]+($|[[:blank:]])' "${OUTPUT_FILE}")"
        elif [ "${EXIT_CODE}" -ne 2 ] && [ -z "${INSPECTED_COUNT}" ] && { [ "${INPUT_SHOW_SUMMARY}" != "true" ] || [ "${INPUT_NO_COLOR}" != "true" ]; }; then
          COUNT_ARGS=()
          for ARG in "${ARGS[@]}"; do
            if [ "${ARG}" != "--check" ] && [ "${ARG}" != "--fix" ] && [ "${ARG}" != "--tokens-only" ]; then
              COUNT_ARGS+=("${ARG}")
            fi
          done
          COUNT_OUTPUT="$(skilllint check --no-color "${COUNT_ARGS[@]}" --show-summary "${PATH_ARGS[@]}" 2>&1 || true)"
          INSPECTED_COUNT="$(sed -n 's/^Total files: \([0-9][0-9]*\)$/\1/p' <<< "${COUNT_OUTPUT}" | tail -n 1)"
        fi

        echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
        echo "inspected-count=${INSPECTED_COUNT}" >> "$GITHUB_OUTPUT"
        FINDINGS_OUTPUT="$(sed -E $'s/\033\[[0-?]*[ -\/]*[@-~]//g' "${OUTPUT_FILE}")"
        echo "findings=$(grep -oE '(^[[:space:]]*(✗ (ERROR|WARN|INFO)|⚠ (WARN|INFO)|❌|⚠|i INFO) |^FIXED )\[[A-Z]{2}[0-9]{3}(, [A-Z]{2}[0-9]{3})*\]' <<< "${FINDINGS_OUTPUT}" | sed -E 's/^.*\[//; s/\]$//' | tr -d ',' | tr ' ' '\n' | sort -u | xargs)" >> "$GITHUB_OUTPUT"
        TOOL_PATH="$(command -v skilllint)"
        TOOL_PYTHON="$(sed -n '1s/^#!//p' "${TOOL_PATH}")"
        echo "tool-python=$("${TOOL_PYTHON}" --version)" >> "$GITHUB_OUTPUT"
        echo "tool-version=$(skilllint --version)" >> "$GITHUB_OUTPUT"
        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "result=passed" >> "$GITHUB_OUTPUT"
        else
          echo "result=failed" >> "$GITHUB_OUTPUT"
        fi

        exit "${EXIT_CODE}"
