# prek - Pre-commit Re-engineered in Rust
# Run `uv run prek run --all-files` first when remediating lint issues so
# auto-fix hooks apply before deeper lint/type triage.
# install via: `uv tool install prek`
# prek is a Rust-based drop-in replacement for pre-commit created by https://github.com/j178/prek
# Sources:
# - https://github.com/j178/prek
# - https://prek.j178.dev/
# - https://pypi.org/project/prek/
# - https://hugovk.dev/blog/2025/ready-prek-go/
# - https://pydevtools.com/blog/prek-pre-commit-but-fast/

default_stages:
  - commit-msg
  - pre-commit

repos:
  - repo: https://github.com/mxr/sync-pre-commit-deps
    rev: v0.0.5
    hooks:
      - id: sync-pre-commit-deps

  # prek now correctly passes commit message file path (issue #1194 fixed)
  - repo: local
    hooks:
      - id: conventional-pre-commit
        name: Conventional Commit
        stages: [commit-msg]
        language: system
        always_run: true
        entry: uv run --with conventional-pre-commit conventional-pre-commit --strict --force-scope

  # Standard pre-commit hooks for general file maintenance
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: destroyed-symlinks
        name: Detect destroyed symlinks
        description: fails if symlinks were converted to plain files (run after repair-symlinks)
      - id: trailing-whitespace
        exclude: (\.(lock|json|toml|ya?ml)$|.gsd/)
      - id: check-yaml
        args: [--unsafe] # Allow Python tags in mkdocs.yml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=10000"] # 10MB limit
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # GitHub Actions workflow static checks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # TOML sorting and formatting
  - repo: https://github.com/bitflight-devops/pyproject-fmt
    rev: v1.1.12
    hooks:
      - id: pypfmt
        name: Sort and format pyproject.toml with pypfmt
        files: ^pyproject\.toml$

  # Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        name: Lint Python with ruff
        args: [--fix]
      - id: ruff-format
        name: Format Python with ruff
  # JavaScript/TypeScript linting with oxlint
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: "v1.80.0"
    hooks:
      - id: oxlint
        args: [--fix]
        exclude: ^(\.?plan(ning)?/|\.claude/backlog/|\.claude/get-shit-done|\.claude/hooks/gsd-.*)

  # JavaScript/TypeScript formatting with oxfmt
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: "v0.65.0"
    hooks:
      - id: oxfmt
        exclude: ^(\.?plan(ning)?/|\.claude/backlog/|\.claude/get-shit-done|\.claude/hooks/gsd-.*)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        exclude: ^(plan/|\.claude/|.planning/)

  # Shell formatting
  - repo: https://github.com/pecigonzalo/pre-commit-shfmt
    rev: v2.2.0
    hooks:
      - id: shell-fmt-go
        args:
          - "--apply-ignore"
          - -w
          - -i
          - "4"
          - -ci

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # Local hooks for type checking
  - repo: local
    hooks:

      - id: ty
        name: ty check
        # ty treats any file carrying PEP 723 inline script metadata (both
        # receiving-pr-reviews scripts, for `uv run --script`) as an isolated
        # single-file script and ignores [tool.ty.environment].extra-paths from
        # pyproject.toml for it entirely (verified against ty 0.0.75). Rather than
        # a caller-specific CLI flag here, the sibling-module search path for
        # test_pr_review_threads.py's `import pr_review_threads` is declared in
        # that script's own [tool.ty.environment] inline-metadata table, so it
        # travels with the file for every caller (this hook, or any direct
        # `ty check`) instead of only this one. CI type-checks `packages/`
        # only, so this hook is the sole gate for these scripts.
        entry: uv run -q ty check
        language: system
        types: [python]
        pass_filenames: true
        # No hook-local exclude: pass_filenames bypasses [tool.ty.src] entirely, but
        # the top-level `exclude:` in this file (below) already covers the one
        # legitimate exclusion (deliberately-broken fixtures, which are non-Python
        # anyway) and applies to every hook including this one.

      - id: enable-rerere
        name: Enable git rerere (auto-replay conflict resolutions)
        entry: bash -c 'git config rerere.enabled true && git config rerere.autoupdate true'
        language: system
        stages: [pre-rebase, post-merge]
        always_run: true
        pass_filenames: false


# Configuration for specific hooks
default_language_version:
  python: python3
  # prek downloads its own Node toolchain and prefers it over the one on PATH.
  # The version it selects (26.8.1, measured 2026-08-31) cannot start on macOS
  # 12.7.6 at all: `~/.cache/prek/tools/node/26.8.1/bin/node --version` aborts
  # with `dyld: Symbol not found: (__ZNSt3__122__libcpp_verbose_abortEPKcz)`,
  # because that libc++ predates the symbol. Every node hook -- oxlint, oxfmt,
  # markdownlint-cli2 -- then fails at install time.
  #
  # `node: system` does NOT fix this. It stops prek downloading a toolchain but
  # not preferring one already downloaded ("Automatic installation is disabled
  # (language_version: system)"). Deleting the toolchain is not durable either:
  # prek re-downloaded 26.8.1 within the hour, on the next hook rev bump.
  # Pinning a version prek can resolve from PATH is what survives.
  #
  # 24.16.0 is the Node already on PATH here, so prek resolves it instead of
  # downloading. Source: `node --version`. Verified on a GitHub runner -- the
  # Prek hooks job passes oxlint, oxfmt and markdownlint-cli2 with this pin.
  # Raise it to any version both prek can resolve and CI provides.
  node: 24.16.0

exclude: ^(\.?plan(ning)?/|\.claude/backlog/|\.claude/get-shit-done|\.claude/hooks/gsd-.*|\.gsd/|packages/skilllint/tests/fixtures/providers/.*/failing-examples/)