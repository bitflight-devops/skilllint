name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot PRs are version bumps with no design to review, and the action
    # rejects bot actors outright ("Workflow initiated by non-human actor").
    # Skipping reports SKIPPED rather than a spurious FAILURE on every bump.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        # In that run the Agent call left run_in_background unset and the harness
        # still started it in the background (subagent_stats: requested unset 1,
        # started_in_background 1). This variable is the CLI's switch for turning
        # background task functionality off; the appended system prompt below is
        # the backup if the variable does not reach the CLI process.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment: without it the code-review plugin prints findings to the
          # job log only and posts nothing to the PR (plugin commands/code-review.md).
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # The inline-comment MCP server is only installed when its tool is
          # listed here; tool list from the action's docs/solutions.md review example.
          # Run 37478584859 (job 112320461611): the review's first turn launched a
          # background subagent for the eligibility check, then its second turn
          # said "Waiting for the eligibility check to finish" and ended. Ending
          # the turn ends this headless job, so no review ran. The appended
          # system prompt keeps every subagent in the foreground.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "Run every subagent in the foreground: set run_in_background to false on each Agent call, and do not end your turn while a subagent is still running."
          # Without this the job log hides the whole run ("full output hidden for
          # security"), so a review that stops after two turns and posts nothing
          # cannot be diagnosed. The log is readable by anyone who can read this
          # repository's Actions logs.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

